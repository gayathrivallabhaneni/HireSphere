openapi: 3.0.3
info:
  title: Multi-Vendor Job Board & Application Portal API
  version: 1.0.0
  description: Robust REST APIs for multi-vendor job board with Candidate, Recruiter,
    and Admin portals.
paths:
  /api/admin-portal/companies/:
    get:
      operationId: admin_portal_companies_list
      description: List and filter all companies on the platform.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCompanyManageList'
          description: ''
  /api/admin-portal/companies/{id}/toggle-active/:
    patch:
      operationId: admin_portal_companies_toggle_active_partial_update
      description: Activate or deactivate a company and its jobs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-portal/companies/{id}/verify/:
    patch:
      operationId: admin_portal_companies_verify_partial_update
      description: Verify or unverify a company profile.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-portal/jobs/:
    get:
      operationId: admin_portal_jobs_list
      description: List and moderate all jobs across the platform.
      parameters:
      - in: query
        name: experience_level
        schema:
          type: string
          enum:
          - ENTRY
          - EXECUTIVE
          - LEAD
          - MID
          - SENIOR
        description: |-
          * `ENTRY` - Entry Level (0-2 yrs)
          * `MID` - Mid Level (2-5 yrs)
          * `SENIOR` - Senior Level (5-8 yrs)
          * `LEAD` - Lead / Staff (8+ yrs)
          * `EXECUTIVE` - Executive / Director
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARCHIVED
          - CLOSED
          - DRAFT
          - PUBLISHED
        description: |-
          * `DRAFT` - Draft
          * `PUBLISHED` - Published
          * `CLOSED` - Closed
          * `ARCHIVED` - Archived
      - in: query
        name: work_mode
        schema:
          type: string
          enum:
          - HYBRID
          - ON_SITE
          - REMOTE
        description: |-
          * `ON_SITE` - On-site
          * `REMOTE` - Remote
          * `HYBRID` - Hybrid
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminJobManageList'
          description: ''
  /api/admin-portal/jobs/{id}/moderate/:
    patch:
      operationId: admin_portal_jobs_moderate_partial_update
      description: Deactivate or archive an inappropriate job posting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-portal/stats/:
    get:
      operationId: admin_portal_stats_retrieve
      description: High-level platform metrics for administrators.
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/admin-portal/users/:
    get:
      operationId: admin_portal_users_list
      description: List and filter all users on the platform.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CANDIDATE
          - RECRUITER
        description: |-
          * `CANDIDATE` - Candidate
          * `RECRUITER` - Recruiter / Employer
          * `ADMIN` - Administrator
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserManageList'
          description: ''
  /api/admin-portal/users/{id}/toggle-active/:
    patch:
      operationId: admin_portal_users_toggle_active_partial_update
      description: Activate or suspend a user account.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/applications/apply/:
    post:
      operationId: applications_apply_create
      description: Candidate submits an application to an active job opening.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobApplicationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationCreate'
          description: ''
  /api/applications/candidate/dashboard-stats/:
    get:
      operationId: applications_candidate_dashboard_stats_retrieve
      description: Metrics and breakdown for Candidate Dashboard.
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/applications/candidate/my-applications/:
    get:
      operationId: applications_candidate_my_applications_list
      description: List all applications submitted by authenticated candidate.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateApplicationListList'
          description: ''
  /api/applications/candidate/my-applications/{id}/:
    get:
      operationId: applications_candidate_my_applications_retrieve
      description: |-
        Retrieve single application details and status audit history for candidate.
        Never exposes recruiter notes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateApplicationDetail'
          description: ''
  /api/applications/candidate/my-applications/{id}/withdraw/:
    post:
      operationId: applications_candidate_my_applications_withdraw_create
      description: |-
        Allow candidate to withdraw their application.
        Permitted if application is in APPLIED or UNDER_REVIEW status.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/applications/recruiter/applications/:
    get:
      operationId: applications_recruiter_applications_list
      description: |-
        List applications submitted to recruiter company's jobs.
        Filterable by job_id, status, search candidate name/email.
      parameters:
      - in: query
        name: job
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPLIED
          - INTERVIEW_SCHEDULED
          - OFFERED
          - REJECTED
          - SHORTLISTED
          - UNDER_REVIEW
          - WITHDRAWN
        description: |-
          * `APPLIED` - Applied
          * `UNDER_REVIEW` - Under Review
          * `SHORTLISTED` - Shortlisted
          * `INTERVIEW_SCHEDULED` - Interview Scheduled
          * `OFFERED` - Offered
          * `REJECTED` - Rejected
          * `WITHDRAWN` - Withdrawn
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecruiterApplicationListList'
          description: ''
  /api/applications/recruiter/applications/{id}/:
    get:
      operationId: applications_recruiter_applications_retrieve
      description: Detailed candidate application review for recruiter, including
        status history and notes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterApplicationDetail'
          description: ''
  /api/applications/recruiter/applications/{id}/notes/:
    get:
      operationId: applications_recruiter_applications_notes_list
      description: List and add private recruiter notes for an application.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecruiterNoteList'
          description: ''
    post:
      operationId: applications_recruiter_applications_notes_create
      description: List and add private recruiter notes for an application.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterNoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecruiterNoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruiterNoteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterNote'
          description: ''
  /api/applications/recruiter/applications/{id}/status/:
    post:
      operationId: applications_recruiter_applications_status_create
      description: Update candidate application status with audit trail.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/applications/recruiter/dashboard-stats/:
    get:
      operationId: applications_recruiter_dashboard_stats_retrieve
      description: Metrics and breakdown for Recruiter Dashboard.
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change password for authenticated user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login endpoint returning JWT access & refresh tokens along with
        user and company metadata.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve or update currently logged-in user profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: Retrieve or update currently logged-in user profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileUpdate'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Retrieve or update currently logged-in user profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileUpdate'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new Candidate or Recruiter user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/candidates/profile/:
    get:
      operationId: candidates_profile_retrieve
      description: Retrieve or update authenticated candidate's profile.
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: candidates_profile_update
      description: Retrieve or update authenticated candidate's profile.
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: candidates_profile_partial_update
      description: Retrieve or update authenticated candidate's profile.
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/candidates/resumes/:
    get:
      operationId: candidates_resumes_list
      description: List candidate's uploaded resumes or upload a new resume.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResumeList'
          description: ''
    post:
      operationId: candidates_resumes_create
      description: List candidate's uploaded resumes or upload a new resume.
      tags:
      - candidates
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResumeUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResumeUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeUpload'
          description: ''
  /api/candidates/resumes/{id}/:
    get:
      operationId: candidates_resumes_retrieve
      description: Retrieve details or delete a candidate's resume.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
          description: ''
    delete:
      operationId: candidates_resumes_destroy
      description: Retrieve details or delete a candidate's resume.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/candidates/resumes/{id}/download/:
    get:
      operationId: candidates_resumes_download_retrieve
      description: |-
        Secure endpoint for downloading a candidate resume.
        Access is granted ONLY to:
        1. The candidate who owns the resume.
        2. A recruiter belonging to a company where the candidate submitted an application referencing this resume.
        3. Platform administrators.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/candidates/resumes/{id}/set-primary/:
    post:
      operationId: candidates_resumes_set_primary_create
      description: Set a specific resume as primary.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - candidates
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/companies/:
    get:
      operationId: companies_list
      description: Public listing of active companies with job openings.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - companies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
  /api/companies/{slug}/:
    get:
      operationId: companies_retrieve
      description: Public company profile details by slug.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/companies/my-company/:
    get:
      operationId: companies_my_company_retrieve
      description: Retrieve or update the authenticated recruiter's company profile.
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: companies_my_company_update
      description: Retrieve or update the authenticated recruiter's company profile.
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: companies_my_company_partial_update
      description: Retrieve or update the authenticated recruiter's company profile.
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/companies/my-recruiters/:
    get:
      operationId: companies_my_recruiters_list
      description: List all recruiters associated with the requesting recruiter's
        company.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
