version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: jobboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobboard_db}
      POSTGRES_USER: ${DB_USER:-jobboard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobboard_secure_password_123!}
    ports:
      # Bound to localhost interface only to prevent public internet exposure
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobboard_user} -d ${DB_NAME:-jobboard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobboard_network

  # ----------------------------------------------------
  # Django REST Framework Backend API Service (Gunicorn)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobboard_backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-for-docker-compose-testing-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,backend,frontend}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-jobboard_db}
      - DB_USER=${DB_USER:-jobboard_user}
      - DB_PASSWORD=${DB_PASSWORD:-jobboard_secure_password_123!}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-600}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173}
      - ACCESS_TOKEN_LIFETIME_MINUTES=${ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      - REFRESH_TOKEN_LIFETIME_DAYS=${REFRESH_TOKEN_LIFETIME_DAYS:-7}
      - MAX_RESUME_SIZE_MB=${MAX_RESUME_SIZE_MB:-5}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-False}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/docs/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobboard_network

  # ----------------------------------------------------
  # React + Vite + Tailwind Frontend Web Service (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: jobboard_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jobboard_network

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  jobboard_network:
    driver: bridge
