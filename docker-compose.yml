version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: jobboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobboard_db}
      POSTGRES_USER: ${DB_USER:-jobboard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobboard_secure_password_123!}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobboard_user} -d ${DB_NAME:-jobboard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # Django REST Framework Backend API Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobboard_backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-for-docker-compose-testing-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web,backend}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-jobboard_db}
      - DB_USER=${DB_USER:-jobboard_user}
      - DB_PASSWORD=${DB_PASSWORD:-jobboard_secure_password_123!}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost,http://127.0.0.1:5173
      - ACCESS_TOKEN_LIFETIME_MINUTES=60
      - REFRESH_TOKEN_LIFETIME_DAYS=7
      - MAX_RESUME_SIZE_MB=5
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------
  # React + Vite + Tailwind Frontend Web Service (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobboard_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
