# ==============================================================================
# Render Infrastructure-as-Code Blueprint for HireSphere
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # 1. Django REST Framework Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: hiresphere-api
    runtime: python
    buildCommand: "./render_build.sh"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /api/docs/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hiresphere-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: SEED_DEMO_DATA
        value: "False"
      - key: MAX_RESUME_SIZE_MB
        value: "5"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React + Vite + Tailwind Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: hiresphere-frontend
    runtime: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      # SPA fallback routing
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database Service
# ------------------------------------------------------------------------------
databases:
  - name: hiresphere-db
    databaseName: hiresphere_db
    user: hiresphere_user
    plan: starter
    ipAllowList: [] # Denies public internet access; only accessible by linked Render services
